[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rng-leak-audit"
version = "0.2.4"
description = "Detect and neutralize PyTorch's DataLoader-iterator global-RNG-state leak (pytorch/pytorch#11062, #122697, #107443)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "zhuhroscar-tech" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zhuhroscar-tech/rng-leak-audit"
Issues = "https://github.com/zhuhroscar-tech/rng-leak-audit/issues"
Changelog = "https://github.com/zhuhroscar-tech/rng-leak-audit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
torch = ["torch>=2.0"]

[project.scripts]
rng-leak-audit = "rng_leak_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
